[project]
name = "instantsplat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "torchvision>=0.19.0",
    "roma>=1.5.1",
    "evo>=1.30.5",
    "gradio==5.3.0",
    "matplotlib>=3.8.0",
    "tqdm==4.66.4",
    "opencv-python>=4.9.0",
    "scipy>=1.12.0",
    "einops>=0.6.1",
    "trimesh>=3.22.0",
    "tensorboard>=2.15.0",
    "pyglet==1.5.31",
    "huggingface-hub[torch]>=0.22",
    "gdown==5.2.0",
    "imageio==2.36.1",
    "cython==3.0.11",
    "icecream==2.1.4",
    "plyfile>=1.1",
    "open3d>=0.19.0",
    "mediapy>=1.2.2",
    "notebook>=7.3.2",
]

[project.optional-dependencies]
cuda = ["simple-knn", "diff-surfel-rasterization", "fused-ssim"]

[tool.uv.sources]
simple-knn = { path = "submodules/simple-knn" }
diff-surfel-rasterization = { path = "submodules/diff-surfel-rasterization"}
fused-ssim = { path = "submodules/fused-ssim" }

[tool.uv]
no-build-isolation-package = ["diff-surfel-rasterization", "simple-knn", "fused-ssim"]
dependency-metadata = [
    { name = "diff_surfel_rasterization", version = "0.0.1", requires-dist = ["torch"], requires-python = ">=3.6" },
    { name = "simple_knn", version = "0.0.1", requires-dist = ["torch"], requires-python = ">=3.6" },
    { name = "fused_ssim", version = "0.0.1", requires-dist = ["torch"], requires-python = ">=3.6" },
]

